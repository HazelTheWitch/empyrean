[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Hazel Rella <hazelrella11@gmail.com>"]
edition = "2024"
description = "N-body gravity simulation framework."
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.30.9", features = ["approx", "rand"] }
approx = "0.5.1"
criterion = "0.8.1"
rand = "0.9.2"
rand_distr = "0.5.1"
thiserror = "2.0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "empyrean"
version.workspace = true
authors.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[features]
default = []
multi-thread = ["dep:rayon", "dep:crossbeam-channel"]

[dependencies]
crossbeam-channel = { version = "0.5.15", optional = true }
glam.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon = { version = "1.11.0", optional = true }
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[[bench]]
name = "simulation"
harness = false
